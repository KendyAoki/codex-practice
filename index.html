<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI勉強会のお知らせ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="event-page">
      <section class="hero" aria-label="AI勉強会のイメージ画像">
        <img
          src="https://images.unsplash.com/photo-1677442135968-6f73d07f7ad8?auto=format&fit=crop&w=2000&q=80"
          alt="AIのイメージとして抽象的な光の流れと人のシルエットが映る写真"
        />
        <div class="hero-overlay"></div>
      </section>

      <section class="event-card" aria-label="開催情報">
        <p class="eyebrow">INTERNAL EVENT</p>
        <h1>社内AI勉強会</h1>
        <div class="details-grid">
          <article class="detail-item">
            <h2>タイトル</h2>
            <p>「現場で活かす生成AI活用術」</p>
          </article>
          <article class="detail-item">
            <h2>開催日時</h2>
            <p>2026年4月17日（金） 18:30〜20:00</p>
          </article>
          <article class="detail-item">
            <h2>場所</h2>
            <p>本社 8F イノベーションラウンジ</p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
